# Change repo to YOUR_GITHUB_USERNAME/YOUR_REPOSITORY_NAME if different.
backend:
  name: github
  repo: isandhyadev/isandhyadev.github.io
  branch: main
media_folder: images
public_folder: images
collections:
  - name: site
    label: My site
    files:
      - name: posts
        label: Writing and updates
        file: content/posts.json
        format: json
        fields:
          - label: Posts
            name: items
            widget: list
            add_to_top: true
            label_singular: post
            summary: "{{fields.date}} {{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Date posted, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
              - { label: Topic, name: tag, widget: string, required: false }
              - { label: Post, name: body, widget: text }
              - { label: Link to full article, name: url, widget: string, required: false }
      - name: gallery
        label: Gallery
        file: content/gallery.json
        format: json
        fields:
          - label: Photos
            name: items
            widget: list
            add_to_top: true
            label_singular: photo
            summary: "{{fields.cap}}"
            fields:
              - { label: Photo, name: src, widget: image }
              - { label: Caption, name: cap, widget: string, required: false }
      - name: experience
        label: Experience
        file: content/experience.json
        format: json
        fields:
          - label: Experience
            name: items
            widget: list
            add_to_top: true
            label_singular: experience
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Organisation, name: org, widget: string, required: false }
              - { label: Dates, name: dates, widget: string, required: false }
              - { label: Responsibilities (one per line), name: body, widget: text, required: false }
              - { label: Tech and tools, name: tools, widget: string, required: false }
              - { label: Link, name: url, widget: string, required: false }
      - name: projects
        label: Projects
        file: content/projects.json
        format: json
        fields:
          - label: Projects
            name: items
            widget: list
            add_to_top: true
            label_singular: project
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Description, name: body, widget: text, required: false }
              - { label: Tech and tools, name: tools, widget: string, required: false }
              - { label: Link, name: url, widget: string, required: false }
